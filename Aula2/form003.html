
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
     <h1>Exemplos de formularios</h1>
     <fieldset>
         <form action="cadastro.php" method="get" autocomplete="on" >

            <legend>Dados pessoas</legend>
              <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required placeholder="Nome">
              </p>
              <p>
                <label for="iemail">Email:</label>
                <input type="email" name="email" id="iemail" required autocomplete="email">
              </p>
              <p>
                <label for="itel">Telefone:</label>
                <input type="tel" name="tel" id="itel" required   minlength="0" maxlength="9">
              </p>
              <p>
                <input type="submit" value="enviar">
                <input type="reset" value="limpar">
              </p>
         </form>
     </fieldset>
</body>
</html>
