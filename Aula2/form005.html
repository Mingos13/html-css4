<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
     <form action="cadastro.php" method="get" autocomplete="on">
        <p><label for="icor">Cor</label>
        <input type="color" name="cor" id="icor" value="#00ff00">
        </p>
        <p><label for="inev">Nivel de satisfacao</label>
        <input type="range" name="nev" id="inev" min="1" max="5" value="2">
        </p>
        <p><label for="ifoto">Foto</label>
        <input type="file" name="foto" id="ifoto">
        </p>
        <p><input type="submit" value="enviar">
        <input type="reset" value="limpar"></p>
     </form>
</body>
</html>
