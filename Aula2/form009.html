<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplos de formularios</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p><label for="iano">Ano de nascimento:</label>
        <input type="number" name="ano" id="iano" min="1990" max="2026" value="2000" oninput="calcidade()">
    </p>

    <p><label for="iidade">Sua idade e </label>
    <output id="iidade"></output></p>

    <p><input type="submit" value="Enviar">
    <input type="reset" value="limpar"></p>
    </form>

    <script>
        function calcidade () {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
