<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="imasc" checked> Masculino
        <input type="radio" name="sexo" id="ifem" checked>Feminino
    </fieldset><br>
    <fieldset>
        <legend>Esportes favoritos</legend>
        <input type="checkbox" name="eifot" id="ifot" ><label for="ifot">Futebol</label><br>
        <input type="checkbox" name="eibas" id="ibas"><label for="ibas">Basquete</label><br>
        <input type="checkbox" name="einat" id="inat"><label for="inat"></label>Natacao<br>
        <input type="checkbox" name="eiten" id="iten"><label for="iten"></label>Tenis<br>
        <input type="checkbox" name="eicar" id="icar"><label for="icar"></label>Cartas<br>
    </fieldset>
</body>
</html>
