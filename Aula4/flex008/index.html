<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>

        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 300px;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 30px;
            
        

        }

        div#l1 {
           align-self: flex-start;
        }
         div#l2 {
           align-self: flex-end;
        }
         div#l3 {
            align-self: stretch;
           
        }
         div#l4 {
           
        }
         div#l5 {
        
        }
         div#l6 {
            align-self: center;
           
        }
         div#l7 {
        
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="l1">A</div>
        <div class="item" id="l2">B</div>
        <div class="item" id="l3">C</div>
        <div class="item" id="l4">D</div>
        <div class="item" id="l5">E</div>
        <div class="item" id="l6">F</div>
        <div class="item" id="l7">G</div>

    </div>
</body>
</html>
