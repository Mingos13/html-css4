<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>

        div.conteiner {
            background-color: lightsalmon;
            height: 100px;
            display: flex;
            flex-flow: column wrap-reverse;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            
            flex: auto;
            
        
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo do bloco A</div>
        <div class="item">Exemplo do bloco B</div>
        <div class="item">Exemplo do bloco C</div>
        <div class="item">Exemplo do bloco D</div>
        <div class="item">Exemplo do bloco E</div>
        <div class="item">Exemplo do bloco F</div>
        <div class="item">Exemplo do bloco G</div>
        

    </div>
</body>
</html>
